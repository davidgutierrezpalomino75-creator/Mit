<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>MIT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #000000;
    --white: #ffffff;
    --gray: #6f6f6f;
    --line: rgba(255,255,255,0.14);
    --accent: #1db954;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--white);
    font-family: 'Space Grotesk', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 32px 20px;
  }

  h1 { font-weight: 700; font-size: 56px; letter-spacing: 4px; margin: 0; line-height: 1; }
  .sub { font-family: 'JetBrains Mono', monospace; color: var(--gray); font-size: 12px; letter-spacing: 2px; text-transform: uppercase; margin-top: 10px; margin-bottom: 20px; }

  .orb {
    width: 132px; height: 132px; border-radius: 50%; border: 2px solid var(--white);
    display: flex; align-items: center; justify-content: center; cursor: pointer;
    transition: transform 0.15s ease, box-shadow 0.3s ease; touch-action: manipulation;
  }
  .orb:active { transform: scale(0.98); } .orb:hover { transform: scale(1.03); }
  .orb svg { width: 40px; height: 40px; fill: var(--white); }

  .orb.listening { animation: pulse 1s ease-in-out infinite; box-shadow: 0 0 0 rgba(255,255,255,0.4); }
  @keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(255,255,255,0.35); } 50% { box-shadow: 0 0 0 18px rgba(255,255,255,0); } }

  #status { margin-top: 12px; font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 1px; text-transform: uppercase; color: var(--gray); min-height: 18px; text-align:center; }

  .panel { margin-top: 18px; width: 100%; max-width: 720px; border-top: 1px solid var(--line); padding-top: 20px; min-height: 50px; font-size: 17px; line-height: 1.6; font-weight: 400; }
  .panel .you { font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 1px; text-transform: uppercase; color: var(--gray); margin-bottom: 6px; }
  .panel .you-text { color: var(--gray); margin-bottom: 18px; white-space: pre-wrap; }
  .panel .mit-label { font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 1px; text-transform: uppercase; color: var(--white); margin-bottom: 6px; }

  .mini-controls { margin-top: 12px; display:flex; gap:8px; align-items:center; justify-content:center; width:100%; }
  .hidden { display:none; }
  .fallback-input { margin-top:12px; display:flex; gap:8px; justify-content:center; width:100%; }
  .fallback-input input[type="text"] { width: calc(100% - 110px); max-width:420px; padding:8px 10px; border-radius:8px; border:1px solid var(--line); background: rgba(255,255,255,0.02); color:var(--white); }
  .btn { background: transparent; border: 1px solid var(--line); color: var(--white); padding: 6px 10px; border-radius: 8px; cursor: pointer; font-family: inherit; }
  .note { font-size:13px; color:var(--gray); margin-top:8px; text-align:center; }
  select, .btn-small { background: transparent; color: var(--white); border: 1px solid var(--line); padding: 6px 8px; border-radius: 6px; font-family: inherit; font-size: 13px; }
  .voice-warning { color: #ffcc00; font-size: 12px; margin-top: 8px; text-align:center; }
  .retry-btn { margin-left:8px; border-color: var(--accent); color: var(--accent); }
  .recording-dot { width:10px; height:10px; border-radius:50%; background:#ff4d4f; display:inline-block; margin-left:8px; vertical-align:middle; box-shadow:0 0 8px rgba(255,77,79,0.6); }
  .record-controls { display:flex; gap:8px; align-items:center; }
  .reminder-ui { margin-top: 10px; display:flex; gap:8px; align-items:center; justify-content:center; flex-wrap:wrap; }
  .reminder-input { padding:6px 8px; border-radius:6px; border:1px solid var(--line); background: rgba(255,255,255,0.02); color:var(--white); }
</style>
</head>
<body>

  <h1>MIT</h1>
  <div class="sub">toca para hablar</div>

  <div class="orb" id="orb" title="Hablar / Escuchar" role="button" aria-label="Hablar">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"/></svg>
  </div>

  <div id="status">en espera</div>

  <div class="mini-controls" id="miniControls">
    <select id="voiceSelect" title="Selecciona la voz"></select>
    <button class="btn" id="stopBtn" title="Detener lectura">Parar</button>
    <button class="btn retry-btn hidden" id="retryBtn" title="Reintentar última pregunta">Reintentar</button>
    <div class="record-controls">
      <button class="btn" id="recordBtn" title="Grabar (iOS & fallback)">Grabar</button>
      <button class="btn hidden" id="stopRecordBtn" title="Parar grabación">Parar grabación</button>
      <span id="recordIndicator" class="hidden" aria-hidden="true"><span class="recording-dot"></span></span>
    </div>
  </div>
  <div class="voice-warning hidden" id="voiceWarning">No se han encontrado voces en español; el navegador usará la voz por defecto.</div>

  <div class="fallback-input hidden" id="fallbackInput">
    <input id="typedInput" type="text" placeholder="Escribe lo que quieras decir..." />
    <button class="btn" id="typedSend">Enviar</button>
  </div>

  <div class="note hidden" id="noteUnsupported">
    Tu navegador no soporta reconocimiento por voz. En iOS Safari la API no está disponible; usa Chrome en Android o graba audio.
  </div>

  <div class="panel" id="panel">
    <div class="mit-label">Mit</div>
    <div>Listo cuando quieras.</div>
  </div>

  <div class="reminder-ui hidden" id="reminderUI">
    <button class="btn" id="r15">En 15 min</button>
    <button class="btn" id="r60">En 1 hora</button>
    <button class="btn" id="rTomorrow">Mañana 9:00</button>
    <input class="reminder-input" id="customReminder" placeholder="ej. 'mañana a las 8' o 'en 30 minutos'"/>
    <button class="btn" id="sendCustomReminder">Enviar recordatorio</button>
  </div>

  <script>
    // Configuración
    const WORKER_URL = 'https://mi-asistente.deivid7575.workers.dev';
    const USER_ID = '1121764396532781207';
    const CHANNEL_ID = '1536519525489573928';

    // Elementos
    const orb = document.getElementById('orb');
    const statusEl = document.getElementById('status');
    const panel = document.getElementById('panel');
    const stopBtn = document.getElementById('stopBtn');
    const fallbackInput = document.getElementById('fallbackInput');
    const typedInput = document.getElementById('typedInput');
    const typedSend = document.getElementById('typedSend');
    const noteUnsupported = document.getElementById('noteUnsupported');
    const voiceSelect = document.getElementById('voiceSelect');
    const voiceWarningEl = document.getElementById('voiceWarning');
    const retryBtn = document.getElementById('retryBtn');
    const recordBtn = document.getElementById('recordBtn');
    const stopRecordBtn = document.getElementById('stopRecordBtn');
    const recordIndicator = document.getElementById('recordIndicator');

    const reminderUI = document.getElementById('reminderUI');
    const r15 = document.getElementById('r15');
    const r60 = document.getElementById('r60');
    const rTomorrow = document.getElementById('rTomorrow');
    const customReminder = document.getElementById('customReminder');
    const sendCustomReminder = document.getElementById('sendCustomReminder');

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognitionSupported = !!SpeechRecognition;

    function makeRecognition() {
      if (!SpeechRecognition) return null;
      const r = new SpeechRecognition();
      r.lang = 'es-ES';
      r.interimResults = false;
      r.maxAlternatives = 1;
      return r;
    }

    // TTS & voices
    let voices = [];
    let currentUtterance = null;
    let lastPrompt = '';

    function loadVoices() { voices = speechSynthesis.getVoices() || []; populateVoiceList(); }
    function populateVoiceList() {
      voiceSelect.innerHTML = '';
      if (!voices.length) {
        const opt = document.createElement('option'); opt.value = ''; opt.textContent = 'No voices'; voiceSelect.appendChild(opt);
        voiceWarningEl.classList.remove('hidden');
        return;
      }
      const spanish = voices.filter(v => /es(-|_)?/i.test(v.lang));
      const others = voices.filter(v => !/es(-|_)?/i.test(v.lang));
      const list = spanish.length ? spanish.concat(others) : voices.slice();
      list.forEach(v => {
        const opt = document.createElement('option');
        opt.value = v.name;
        opt.textContent = `${v.name} — ${v.lang}`;
        voiceSelect.appendChild(opt);
      });
      const saved = localStorage.getItem('mit_voice');
      if (saved && list.find(x => x.name === saved)) voiceSelect.value = saved;
      else {
        const prefer = list.find(v => /pablo|jorge|diego|david|male|hombre/i.test(v.name) && /es/i.test(v.lang))
                    || list.find(v => /google/i.test(v.name) && /es/i.test(v.lang))
                    || list.find(v => /es/i.test(v.lang))
                    || list[0];
        if (prefer) voiceSelect.value = prefer.name;
        if (voiceSelect.value) localStorage.setItem('mit_voice', voiceSelect.value);
      }
      voiceWarningEl.classList.toggle('hidden', spanish.length > 0);
    }
    loadVoices();
    if (typeof speechSynthesis !== 'undefined') speechSynthesis.onvoiceschanged = loadVoices;
    voiceSelect.addEventListener('change', () => localStorage.setItem('mit_voice', voiceSelect.value));

    function pickVoice() {
      const name = voiceSelect.value;
      if (name) { const v = voices.find(x => x.name === name); if (v) return v; }
      const masculina = voices.find(v => /es/i.test(v.lang) && /(pablo|jorge|diego|male|hombre|david)/i.test(v.name));
      if (masculina) return masculina;
      return voices.find(v => /es/i.test(v.lang)) || null;
    }

    // TTS unlock + robust speak with AudioContext unlock (improves iOS/Chrome)
    let ttsUnlocked = false;
    let audioContext = null;
    function unlockTTSOnce() {
      if (ttsUnlocked) return;
      ttsUnlocked = true;
      try {
        // WebAudio resume trick (works in many iOS webviews)
        const AC = window.AudioContext || window.webkitAudioContext;
        if (AC && !audioContext) {
          audioContext = new AC();
          if (audioContext.state === 'suspended') {
            audioContext.resume().catch(()=>{});
            // play a tiny silent buffer to ensure audio unlocking
            try {
              const buffer = audioContext.createBuffer(1, 1, audioContext.sampleRate);
              const src = audioContext.createBufferSource();
              src.buffer = buffer;
              src.connect(audioContext.destination);
              src.start(0);
              setTimeout(()=>{ try { src.disconnect(); } catch(e){} }, 50);
            } catch(e) { /* ignore */ }
          }
        }
      } catch (e) {
        console.warn('AudioContext unlock failed', e);
      }
      try {
        // Also try a short utterance and cancel it
        const test = new SpeechSynthesisUtterance('.');
        speechSynthesis.speak(test);
        setTimeout(() => {
          try { speechSynthesis.cancel(); } catch (e) {}
        }, 60);
      } catch (e) {
        console.warn('unlockTTS utterance failed', e);
      }
    }

    ['pointerdown', 'touchend', 'click'].forEach(evt => {
      document.addEventListener(evt, function _onceForTTS(e) {
        unlockTTSOnce();
      }, { passive: true, capture: true });
    });

    function waitForVoices(timeout = 1400) {
      return new Promise((resolve) => {
        const v = speechSynthesis.getVoices();
        if (v && v.length) return resolve(v);
        let resolved = false;
        const onChange = () => {
          if (resolved) return;
          const voicesNow = speechSynthesis.getVoices();
          if (voicesNow && voicesNow.length) {
            resolved = true;
            speechSynthesis.removeEventListener('voiceschanged', onChange);
            resolve(voicesNow);
          }
        };
        speechSynthesis.addEventListener('voiceschanged', onChange);
        setTimeout(() => {
          if (!resolved) {
            resolved = true;
            speechSynthesis.removeEventListener('voiceschanged', onChange);
            resolve(speechSynthesis.getVoices() || []);
          }
        }, timeout);
      });
    }

    async function speak(text) {
      stopSpeaking();
      if (!('speechSynthesis' in window)) { statusEl.textContent = 'voz no soportada'; return; }

      if (!ttsUnlocked) {
        try { unlockTTSOnce(); } catch (e) {}
      }

      const available = await waitForVoices(1400);
      voices = available.length ? available : speechSynthesis.getVoices() || voices;

      const utter = new SpeechSynthesisUtterance(text);

      let voice = null;
      try {
        if (voiceSelect && voiceSelect.value) {
          voice = (voices || []).find(v => v.name === voiceSelect.value) || null;
        }
        if (!voice) {
          voice = (voices || []).find(v => /es(-|_)?/i.test(v.lang)) || (voices || [])[0] || null;
        }
        if (voice) { utter.voice = voice; utter.lang = voice.lang || 'es-ES'; }
        else utter.lang = 'es-ES';
      } catch (e) {
        console.warn('voice pick error', e);
        utter.lang = 'es-ES';
      }

      utter.pitch = 0.7; utter.rate = 0.98; utter.volume = 1;
      utter.onstart = () => { currentUtterance = utter; statusEl.textContent = 'hablando'; };
      utter.onend = () => { if (currentUtterance === utter) currentUtterance = null; if (!orb.classList.contains('listening')) statusEl.textContent = 'en espera'; };
      utter.onerror = (e) => { console.error('TTS error', e); if (currentUtterance === utter) currentUtterance = null; statusEl.textContent = 'error'; };

      try {
        speechSynthesis.speak(utter);
      } catch (e) {
        console.error('speechSynthesis.speak threw', e);
        statusEl.textContent = 'error TTS';
      }
    }

    function stopSpeaking() {
      try {
        if (speechSynthesis.speaking || speechSynthesis.pending) speechSynthesis.cancel();
        currentUtterance = null;
        if (!orb.classList.contains('listening')) statusEl.textContent = 'en espera';
      } catch (e) { console.error('stopSpeaking error', e); }
    }

    function escapeHtml(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
    function renderPanel(you, mit){
      panel.innerHTML = `${you ? `<div class="you">Tú</div><div class="you-text">${escapeHtml(you)}</div>` : ''}<div class="mit-label">Mit</div><div>${escapeHtml(mit)}</div>`;
    }

    async function processPromptOnServer(promptText) {
      try {
        const res = await fetch(WORKER_URL + '/api/voice', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ userId: USER_ID, channelId: CHANNEL_ID, promptText })
        });
        return await res.json();
      } catch (err) { console.error('processPromptOnServer error', err); throw err; }
    }

    async function sendToMit(promptText, { saveLast=true } = {}) {
      if (saveLast) lastPrompt = promptText;
      stopSpeaking();
      retryBtn.classList.add('hidden');
      reminderUI.classList.add('hidden');
      renderPanel(promptText, 'Procesando...');
      statusEl.textContent = 'procesando';
      try {
        const data = await processPromptOnServer(promptText);
        const respuesta = data.responseText || 'No he podido procesar eso.';
        renderPanel(promptText, respuesta);
        statusEl.textContent = 'en espera';

        // If server asks for reminder time, show UI
        if ((respuesta || '').includes('¿A qué hora quieres que te recuerde')) {
          showReminderUI(promptText);
        }

        const normalized = (respuesta || '').trim().toLowerCase();
        if (normalized.length < 10) retryBtn.classList.remove('hidden');
        else retryBtn.classList.add('hidden');

        speak(respuesta);
      } catch (err) {
        renderPanel(promptText, `Error de conexión: ${err.message || err}`);
        statusEl.textContent = 'error';
      }
    }

    function startSpeechRecognitionOnce() {
      if (!SpeechRecognition) return;
      const recognition = makeRecognition();
      if (!recognition) return;
      stopSpeaking();
      orb.classList.add('listening');
      statusEl.textContent = 'escuchando...';

      recognition.onresult = (event) => {
        const transcript = event.results[0][0].transcript;
        orb.classList.remove('listening');
        sendToMit(transcript, { saveLast:true });
      };
      recognition.onerror = (ev) => {
        console.error('recognition error', ev);
        orb.classList.remove('listening');
        statusEl.textContent = 'no te he oído bien';
        if (ev.error === 'not-allowed' || ev.error === 'permission-denied') {
          renderPanel('', 'Has denegado el acceso al micrófono. Ve a la configuración del navegador para permitirlo.');
        }
      };
      recognition.onend = () => {
        orb.classList.remove('listening');
        if (!currentUtterance) statusEl.textContent = 'en espera';
      };
      recognition.onstart = () => { stopSpeaking(); };

      try { recognition.start(); } catch (err) {
        console.warn('recognition.start error', err);
        orb.classList.remove('listening');
        statusEl.textContent = 'error';
        if (err.name === 'NotAllowedError' || /permission/i.test(err.message || '')) {
          renderPanel('', 'Permiso de micrófono denegado. Activa el micrófono en la configuración del navegador y vuelve a intentarlo.');
        } else {
          renderPanel('', 'No se pudo iniciar el reconocimiento. Prueba a recargar o usar otro navegador.');
        }
      }
    }

    // UI handlers for orb (desktop/mobile)
    orb.addEventListener('pointerup', (e) => {
      e.preventDefault();
      if (!SpeechRecognition) {
        if (!fallbackInput.classList.contains('hidden')) typedInput.focus();
        return;
      }
      startSpeechRecognitionOnce();
    }, { passive: false });

    orb.addEventListener('click', (e) => {
      e.preventDefault();
      if (!SpeechRecognition) {
        if (!fallbackInput.classList.contains('hidden')) typedInput.focus();
        return;
      }
      startSpeechRecognitionOnce();
    });

    stopBtn.addEventListener('click', () => stopSpeaking());

    typedSend.addEventListener('click', () => {
      const text = (typedInput.value || '').trim();
      if (!text) return;
      typedInput.value = '';
      sendToMit(text, { saveLast: true });
    });
    typedInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); typedSend.click(); } });

    retryBtn.addEventListener('click', () => { if (!lastPrompt) return; sendToMit(lastPrompt, { saveLast: false }); retryBtn.classList.add('hidden'); });

    window.addEventListener('keydown', (e) => {
      const target = document.activeElement;
      const tag = target && target.tagName ? target.tagName.toLowerCase() : null;
      const editable = target && (target.isContentEditable === true);
      const focusIsTextField = tag === 'input' || tag === 'textarea' || editable;
      if (e.code === 'Space') {
        if (focusIsTextField) return;
        e.preventDefault();
        if (!SpeechRecognition) {
          if (!fallbackInput.classList.contains('hidden')) typedInput.focus();
          return;
        }
        startSpeechRecognitionOnce();
      }
      if (e.code === 'Escape') stopSpeaking();
    });

    // Recording (MediaRecorder) with explicit stop button & language hint
    let mediaRecorder = null;
    let audioStream = null;
    let audioChunks = [];
    let recording = false;
    let preferredMime = null;

    if (typeof MediaRecorder !== 'undefined') {
      const mimeCandidates = ['audio/webm;codecs=opus', 'audio/webm', 'audio/ogg;codecs=opus', 'audio/wav'];
      for (const m of mimeCandidates) {
        try {
          if (MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(m)) { preferredMime = m; break; }
        } catch { }
      }
    }

    async function startRecording() {
      try {
        audioStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        if (preferredMime) mediaRecorder = new MediaRecorder(audioStream, { mimeType: preferredMime });
        else mediaRecorder = new MediaRecorder(audioStream);
        audioChunks = [];
        mediaRecorder.ondataavailable = (e) => { if (e.data && e.data.size > 0) audioChunks.push(e.data); };
        mediaRecorder.onstop = async () => {
          recordIndicator.classList.add('hidden');
          stopRecordBtn.classList.add('hidden');
          recording = false;
          const blobType = mediaRecorder && mediaRecorder.mimeType ? mediaRecorder.mimeType : 'audio/webm';
          const blob = new Blob(audioChunks, { type: blobType });
          audioChunks = [];
          try { audioStream.getTracks().forEach(t => t.stop()); } catch {}
          audioStream = null;
          mediaRecorder = null;
          await uploadAudioAndProcess(blob, 'es');
        };
        mediaRecorder.start();
        recording = true;
        recordIndicator.classList.remove('hidden');
        stopRecordBtn.classList.remove('hidden');
        statusEl.textContent = 'grabando...';
        unlockTTSOnce(); // ensure audio unlocked while user interacts
      } catch (err) {
        console.error('startRecording error', err);
        renderPanel('', 'No se pudo acceder al micrófono. Comprueba permisos.');
        statusEl.textContent = 'error';
      }
    }

    function stopRecording() {
      try { if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop(); else { recordIndicator.classList.add('hidden'); stopRecordBtn.classList.add('hidden'); recording = false; } } catch (e) { console.error('stopRecording error', e); }
    }

    // Helper: send a prompt to server but only if transcription seems valid
    async function uploadAudioAndProcess(blob, language = 'es') {
      stopSpeaking();
      renderPanel('', 'Transcribiendo audio...');
      statusEl.textContent = 'procesando';
      try {
        const form = new FormData();
        form.append('file', blob, 'record.' + (blob.type.includes('ogg') ? 'ogg' : blob.type.includes('wav') ? 'wav' : 'webm'));
        form.append('userId', USER_ID);
        form.append('channelId', CHANNEL_ID);
        form.append('language', language); // hint for STT

        const res = await fetch(WORKER_URL + '/api/stt', { method: 'POST', body: form });
        const data = await res.json();
        if (data.error) {
          renderPanel('', `Error: ${data.error}`);
          statusEl.textContent = 'error';
          return;
        }
        const transcription = (data.transcription || '').trim();
        const responseText = data.responseText || '';

        // If transcription is empty or extremely short, prompt to retry (avoid sending 'a' or noisy bits)
        if (!transcription || transcription.length < 3) {
          renderPanel(transcription || '', responseText || 'No se entendió con claridad. Pulsa grabar de nuevo o escribe tu mensaje.');
          statusEl.textContent = 'en espera';
          // keep retry visible
          retryBtn.classList.remove('hidden');
          return;
        }

        // Show transcription and response
        renderPanel(transcription, responseText || 'Procesando...');
        statusEl.textContent = 'en espera';

        // If server asked for reminder time, show UI
        if ((responseText || '').includes('¿A qué hora quieres que te recuerde')) {
          showReminderUI(transcription);
        }

        if (responseText) speak(responseText);
        else {
          // If no model response, but transcription exists, attempt to call /api/voice as fallback
          try { const fallback = await processPromptOnServer(transcription); if (fallback?.responseText) { renderPanel(transcription, fallback.responseText); speak(fallback.responseText); } } catch(e){ console.warn('fallback /api/voice failed', e); }
        }

      } catch (err) {
        console.error('uploadAudioAndProcess error', err);
        renderPanel('', `Error al subir audio: ${err.message || err}`);
        statusEl.textContent = 'error';
      }
    }

    // Buttons
    recordBtn.addEventListener('click', () => {
      if (!recording) startRecording();
      else stopRecording();
    });
    stopRecordBtn.addEventListener('click', stopRecording);

    // Reminder quick UI handlers
    function showReminderUI(originalText) {
      reminderUI.classList.remove('hidden');
      // Pre-fill custom input with original text context (optional)
      customReminder.value = '';
      // Bind clicks will send constructed prompts to server
    }
    function hideReminderUI() {
      reminderUI.classList.add('hidden');
    }

    r15.addEventListener('click', () => {
      const prompt = 'Recuérdame en 15 minutos: ' + (lastPrompt || '');
      hideReminderUI();
      sendToMit(prompt);
    });
    r60.addEventListener('click', () => {
      const prompt = 'Recuérdame en 60 minutos: ' + (lastPrompt || '');
      hideReminderUI();
      sendToMit(prompt);
    });
    rTomorrow.addEventListener('click', () => {
      const prompt = 'Recuérdame mañana a las 9:00: ' + (lastPrompt || '');
      hideReminderUI();
      sendToMit(prompt);
    });
    sendCustomReminder.addEventListener('click', () => {
      const txt = (customReminder.value || '').trim();
      if (!txt) return;
      const prompt = `Recuérdame ${txt}: ${lastPrompt || ''}`;
      hideReminderUI();
      sendToMit(prompt);
    });

    window.addEventListener('load', () => {
      if (!recognitionSupported) {
        noteUnsupported.classList.remove('hidden');
        fallbackInput.classList.remove('hidden');
      }
      const saved = localStorage.getItem('mit_voice');
      if (saved) setTimeout(() => {
        const opt = Array.from(voiceSelect.options).find(o => o.value === saved);
        if (opt) voiceSelect.value = saved;
      }, 500);
    });

    window.__mit_debug = { startRecording, stopRecording, startSpeechRecognitionOnce, unlockTTSOnce };
  </script>
</body>
</html>
