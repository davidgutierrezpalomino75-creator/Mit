<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>MIT</title>
<style>
  :root{--bg:#000;--white:#fff;--gray:#9a9a9a;--line:rgba(255,255,255,0.12);--accent:#1db954}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--white);font-family:system-ui,Segoe UI,Roboto,Helvetica,Arial;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px}
  h1{margin:0;font-size:48px;letter-spacing:2px}
  .sub{color:var(--gray);margin-bottom:18px;font-size:12px;text-transform:uppercase}
  .orb{width:120px;height:120px;border-radius:50%;border:2px solid var(--white);display:flex;align-items:center;justify-content:center;cursor:pointer;touch-action:manipulation}
  .orb svg{width:38px;height:38px;fill:var(--white)}
  #status{margin-top:12px;color:var(--gray);font-size:12px;min-height:18px;text-align:center}
  .panel{margin-top:18px;width:100%;max-width:720px;border-top:1px solid var(--line);padding-top:18px;min-height:56px;font-size:16px;line-height:1.5}
  .controls{margin-top:14px;display:flex;gap:8px;align-items:center;justify-content:center;width:100%}
  select,.btn,input{background:transparent;color:var(--white);border:1px solid var(--line);padding:8px;border-radius:8px}
  .hidden{display:none}
  .recording-dot{width:10px;height:10px;border-radius:50%;background:#ff4d4f;box-shadow:0 0 8px rgba(255,77,79,0.5)}
  .small{padding:6px 8px;font-size:13px}
  #manualPlay{border-color:var(--accent);color:var(--accent)}
  .note{color:var(--gray);font-size:13px;margin-top:8px;text-align:center}
</style>
</head>
<body>
  <h1>MIT</h1>
  <div class="sub">toca para hablar</div>

  <div class="orb" id="orb" role="button" aria-label="Hablar">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"/></svg>
  </div>

  <div id="status">en espera</div>

  <div class="controls" id="controls">
    <select id="voiceSelect" title="Selecciona la voz"></select>
    <button class="btn small" id="stopBtn">Parar</button>
    <button class="btn small hidden" id="recordBtn">Grabar</button>
    <button class="btn small hidden" id="stopRecordBtn">Parar grabación</button>
    <span id="recDot" class="hidden recording-dot" aria-hidden="true"></span>
    <button class="btn small hidden" id="manualPlay">Reproducir respuesta</button>
  </div>

  <div class="note hidden" id="voiceWarning">No hay voces en español detectadas; se usará la voz por defecto del sistema.</div>

  <div class="panel" id="panel">
    <div class="mit-label">Mit</div>
    <div id="panelText">Listo cuando quieras.</div>
  </div>

<script>
/* CONFIG */
const WORKER_URL = 'https://mi-asistente.deivid7575.workers.dev';
const USER_ID = '1121764396532781207';
const CHANNEL_ID = '1536519525489573928';

/* ELEMENTS */
const orb = document.getElementById('orb');
const statusEl = document.getElementById('status');
const voiceSelect = document.getElementById('voiceSelect');
const stopBtn = document.getElementById('stopBtn');
const recordBtn = document.getElementById('recordBtn');
const stopRecordBtn = document.getElementById('stopRecordBtn');
const recDot = document.getElementById('recDot');
const manualPlay = document.getElementById('manualPlay');
const voiceWarning = document.getElementById('voiceWarning');
const panelText = document.getElementById('panelText');

let voices = [];
let currentUtterance = null;
let lastPrompt = '';
let lastResponseText = '';
let ttsUnlocked = false;
let audioContext = null;

/* VOICES */
function loadVoices(){ voices = speechSynthesis.getVoices() || []; populateVoiceList(); }
function populateVoiceList(){
  voiceSelect.innerHTML = '';
  if(!voices.length){ voiceSelect.appendChild(new Option('No voices','')); voiceWarning.classList.remove('hidden'); return; }
  const spanish = voices.filter(v=>/es(-|_)?/i.test(v.lang));
  const list = spanish.length ? spanish : voices;
  list.forEach(v=> voiceSelect.appendChild(new Option(`${v.name} — ${v.lang}`, v.name)));
  voiceWarning.classList.toggle('hidden', spanish.length>0);
  const saved = localStorage.getItem('mit_voice');
  if(saved && Array.from(voiceSelect.options).find(o=>o.value===saved)) voiceSelect.value = saved;
}
if(typeof speechSynthesis!=='undefined') speechSynthesis.onvoiceschanged = loadVoices;
loadVoices();
voiceSelect.addEventListener('change', ()=> localStorage.setItem('mit_voice', voiceSelect.value));

/* TTS UNLOCK */
function tryUnlockAudio(){
  if(ttsUnlocked) return;
  ttsUnlocked = true;
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if(AC){
      audioContext = new AC();
      if(audioContext.state === 'suspended') audioContext.resume().catch(()=>{});
      try {
        const buffer = audioContext.createBuffer(1,1,audioContext.sampleRate);
        const src = audioContext.createBufferSource();
        src.buffer = buffer;
        src.connect(audioContext.destination);
        src.start(0);
        setTimeout(()=>{ try{ src.disconnect(); }catch(e){} }, 50);
      }catch(e){}
    }
  } catch(e){ console.warn('AudioContext unlock failed', e); }
  try {
    const u = new SpeechSynthesisUtterance('.');
    speechSynthesis.speak(u);
    setTimeout(()=>{ try{ speechSynthesis.cancel(); }catch(e){} }, 80);
  } catch(e){ console.warn('speechSynthesis test utter failed', e); }
}

/* WAIT VOICES */
function waitForVoices(timeout=1200){
  return new Promise(resolve=>{
    const v = speechSynthesis.getVoices();
    if(v && v.length) return resolve(v);
    let done=false;
    const onChange = ()=>{
      if(done) return;
      const voicesNow = speechSynthesis.getVoices();
      if(voicesNow && voicesNow.length){ done=true; speechSynthesis.removeEventListener('voiceschanged', onChange); resolve(voicesNow); }
    };
    speechSynthesis.addEventListener('voiceschanged', onChange);
    setTimeout(()=>{ if(!done){ done=true; speechSynthesis.removeEventListener('voiceschanged', onChange); resolve(speechSynthesis.getVoices()||[]); } }, timeout);
  });
}

/* SPEAK with fallback button if not started */
async function speak(text){
  lastResponseText = text || '';
  stopSpeaking();
  if(!('speechSynthesis' in window)){ statusEl.textContent='voz no soportada'; return; }

  tryUnlockAudio();
  const available = await waitForVoices(1200);
  voices = available.length ? available : speechSynthesis.getVoices() || voices;

  const utter = new SpeechSynthesisUtterance(text);
  let voice=null;
  try{
    if(voiceSelect.value) voice = voices.find(v=>v.name===voiceSelect.value) || null;
    if(!voice) voice = voices.find(v=>/es(-|_)?/i.test(v.lang)) || voices[0] || null;
    if(voice){ utter.voice = voice; utter.lang = voice.lang || 'es-ES'; } else utter.lang='es-ES';
  } catch(e){ utter.lang='es-ES'; }

  utter.pitch=0.9; utter.rate=0.95; utter.volume=1;
  utter.onstart = ()=>{ currentUtterance = utter; statusEl.textContent='hablando'; manualPlay.classList.add('hidden'); };
  utter.onend = ()=>{ if(currentUtterance===utter) currentUtterance=null; statusEl.textContent='en espera'; };
  utter.onerror = (e)=>{ console.error('TTS error', e); if(currentUtterance===utter) currentUtterance=null; statusEl.textContent='error'; manualPlay.classList.remove('hidden'); };

  try{
    speechSynthesis.speak(utter);
    // If speech doesn't start within X ms, show manual play
    setTimeout(()=>{
      if(!currentUtterance){
        // assume blocked; show manual play so user can trigger after interaction
        manualPlay.classList.remove('hidden');
      } else {
        manualPlay.classList.add('hidden');
      }
    }, 900);
  } catch(e){
    console.error('speak threw', e);
    statusEl.textContent='error TTS';
    manualPlay.classList.remove('hidden');
  }
}

function stopSpeaking(){
  try{ if(speechSynthesis.speaking || speechSynthesis.pending) speechSynthesis.cancel(); currentUtterance=null; statusEl.textContent='en espera'; } catch(e){ console.error(e); }
}

/* MANUAL PLAY button */
manualPlay.addEventListener('click', ()=>{
  if(lastResponseText) {
    // try to unlock again with user interaction, then speak
    tryUnlockAudio();
    speak(lastResponseText);
  }
});

/* UI render */
function renderPanel(user, mit){
  lastPrompt = user || lastPrompt;
  panelText.innerHTML = (user ? `<div style="color:var(--gray);font-size:12px;margin-bottom:6px">Tú</div><div style="color:var(--gray);white-space:pre-wrap;margin-bottom:10px">${escapeHtml(user)}</div>` : '') +
    `<div style="color:var(--gray);font-size:12px;margin-bottom:6px">Mit</div><div style="white-space:pre-wrap">${escapeHtml(mit)}</div>`;
  // if TTS seems blocked, keep manualPlay visible
}

/* helpers */
function escapeHtml(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

/* NETWORK: /api/voice */
async function processPromptOnServer(promptText){
  try{
    const res = await fetch(WORKER_URL + '/api/voice', {
      method:'POST', headers:{ 'Content-Type':'application/json' },
      body: JSON.stringify({ userId: USER_ID, channelId: CHANNEL_ID, promptText })
    });
    return await res.json();
  } catch(e){ console.error('processPrompt error', e); throw e; }
}

/* flow when using recognition or typed text */
async function sendToMit(promptText, { saveLast=true } = {}){
  if(saveLast) lastPrompt = promptText;
  stopSpeaking();
  manualPlay.classList.add('hidden');
  renderPanel(promptText, 'Procesando...');
  statusEl.textContent='procesando';
  try {
    const data = await processPromptOnServer(promptText);
    const respuesta = data.responseText || 'No he podido procesar eso.';
    renderPanel(promptText, respuesta);
    statusEl.textContent='en espera';
    // if server asks "¿A qué hora..." we leave it as conversation (no extra UI)
    lastResponseText = respuesta;
    // try to speak; for mobile this may be blocked but manualPlay will appear
    speak(respuesta);
  } catch(err){
    console.error('sendToMit failed', err);
    renderPanel(promptText, `Error: ${err.message || err}`);
    statusEl.textContent='error';
    manualPlay.classList.remove('hidden');
  }
}

/* SPEECH RECOGNITION (desktop / mobile if exposed) */
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
function makeRecognition(){
  if(!SpeechRecognition) return null;
  const r = new SpeechRecognition();
  r.lang = 'es-ES';
  r.interimResults = false;
  r.maxAlternatives = 1;
  return r;
}

function startSpeechRecognitionOnce(){
  if(!SpeechRecognition) return;
  const recognition = makeRecognition();
  if(!recognition) return;
  stopSpeaking();
  orb.classList.add('listening');
  statusEl.textContent = 'escuchando...';
  recognition.onresult = (ev)=>{ const transcript = ev.results[0][0].transcript; orb.classList.remove('listening'); sendToMit(transcript, { saveLast:true }); };
  recognition.onerror = (ev)=>{ console.error('rec error', ev); orb.classList.remove('listening'); statusEl.textContent='no te he oído'; renderPanel('', 'Error reconocimiento: ' + (ev.error || 'desconocido')); manualPlay.classList.remove('hidden'); };
  recognition.onend = ()=>{ orb.classList.remove('listening'); if(!currentUtterance) statusEl.textContent='en espera'; };
  recognition.onstart = ()=>{ stopSpeaking(); };
  try{ recognition.start(); } catch(e){ console.warn('recognition.start threw', e); orb.classList.remove('listening'); statusEl.textContent='error reconocimiento'; manualPlay.classList.remove('hidden'); }
}

/* MEDIARECORDER fallback for iOS recordings (kept as before) */
let mediaRecorder=null, audioStream=null, audioChunks=[], recording=false, preferredMime=null;
if(typeof MediaRecorder !== 'undefined'){
  const candidates = ['audio/webm;codecs=opus','audio/webm','audio/ogg;codecs=opus','audio/wav'];
  for(const m of candidates) try{ if(MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(m)){ preferredMime=m; break; } } catch(e){}
}

async function startRecording(){
  try{
    audioStream = await navigator.mediaDevices.getUserMedia({ audio:true });
    mediaRecorder = preferredMime ? new MediaRecorder(audioStream, { mimeType: preferredMime }) : new MediaRecorder(audioStream);
    audioChunks = [];
    mediaRecorder.ondataavailable = e=>{ if(e.data && e.data.size>0) audioChunks.push(e.data); };
    mediaRecorder.onstop = async ()=>{
      recDot.classList.add('hidden'); stopRecordBtn.classList.add('hidden'); recording=false;
      const blobType = mediaRecorder && mediaRecorder.mimeType ? mediaRecorder.mimeType : 'audio/webm';
      const blob = new Blob(audioChunks, { type: blobType });
      audioChunks=[];
      try{ audioStream.getTracks().forEach(t=>t.stop()); } catch(e){}
      audioStream=null; mediaRecorder=null;
      await uploadAudioAndProcess(blob,'es');
    };
    mediaRecorder.start();
    recording=true; recDot.classList.remove('hidden'); stopRecordBtn.classList.remove('hidden'); statusEl.textContent='grabando...';
    tryUnlockAudio();
  } catch(e){ console.error('startRecording failed', e); renderPanel('', 'No se pudo acceder al micrófono. Comprueba permisos.'); statusEl.textContent='error'; manualPlay.classList.remove('hidden'); }
}
function stopRecording(){ try{ if(mediaRecorder && mediaRecorder.state!=='inactive') mediaRecorder.stop(); else { recording=false; recDot.classList.add('hidden'); stopRecordBtn.classList.add('hidden'); } } catch(e){ console.error('stopRecording', e); } }

/* upload STT and process transcription locally (worker returns transcription + responseText) */
async function uploadAudioAndProcess(blob, language='es'){
  stopSpeaking();
  renderPanel('', 'Transcribiendo audio...');
  statusEl.textContent='procesando';
  try {
    const form = new FormData();
    form.append('file', blob, 'record.' + (blob.type.includes('ogg')?'ogg': blob.type.includes('wav')?'wav':'webm'));
    form.append('userId', USER_ID);
    form.append('channelId', CHANNEL_ID);
    form.append('language', language);
    const res = await fetch(WORKER_URL + '/api/stt', { method:'POST', body: form });
    const data = await res.json();
    if(data.error){ renderPanel('', 'Error: ' + data.error); statusEl.textContent='error'; manualPlay.classList.remove('hidden'); return; }
    const transcription = (data.transcription || '').trim();
    const responseText = data.responseText || '';
    if(!transcription || transcription.length < 3){
      renderPanel(transcription || '', responseText || 'No se entendió con claridad. Pulsa grabar de nuevo o escribe tu mensaje.');
      statusEl.textContent='en espera';
      manualPlay.classList.remove('hidden');
      return;
    }
    renderPanel(transcription, responseText || '');
    lastResponseText = responseText || '';
    if(responseText) speak(responseText);
    else {
      // if worker didn't include model response, call /api/voice as fallback
      try { const fallback = await processPromptOnServer(transcription); if(fallback?.responseText){ renderPanel(transcription, fallback.responseText); speak(fallback.responseText); } } catch(e){ console.warn('fallback voice call failed', e); manualPlay.classList.remove('hidden'); }
    }
    statusEl.textContent='en espera';
  } catch(e){ console.error('upload error', e); renderPanel('', 'Error al subir audio: ' + (e.message || e)); statusEl.textContent='error'; manualPlay.classList.remove('hidden'); }
}

/* UI wiring */
orb.addEventListener('click', (e)=>{ e.preventDefault(); if(window.SpeechRecognition || window.webkitSpeechRecognition) startSpeechRecognitionOnce(); else { /* no native recog -> focus input or show record */ recordBtn.click(); } });
stopBtn.addEventListener('click', ()=> stopSpeaking());
recordBtn.addEventListener('click', ()=> recording ? stopRecording() : startRecording());
stopRecordBtn.addEventListener('click', stopRecording);

/* expose some debug */
window.__mit_debug = { startRecording, stopRecording, speak, tryUnlockAudio };

/* On load */
window.addEventListener('load', ()=> {
  // show record buttons if MediaRecorder available (mobile fallback)
  if(typeof MediaRecorder !== 'undefined') { recordBtn.classList.remove('hidden'); }
  // ensure voices loaded
  setTimeout(()=>{ loadVoices(); }, 500);
  // ensure user gesture unlocking hint
  document.addEventListener('pointerdown', ()=> tryUnlockAudio(), { once:true, passive:true });
});
</script>
</body>
</html>
