<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MIT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@300;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #050604;
    --panel: #0d0f0a;
    --amber: #ffb020;
    --amber-dim: #4a3312;
    --amber-faint: #241a08;
    --text: #eee6d6;
    --text-dim: #8a7f68;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background:
      radial-gradient(ellipse at 50% 0%, #14130c 0%, var(--bg) 55%);
    color: var(--text);
    font-family: 'Rajdhani', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 32px 20px;
    position: relative;
    overflow: hidden;
  }

  /* Líneas de fondo tipo HUD */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(var(--amber-faint) 1px, transparent 1px),
      linear-gradient(90deg, var(--amber-faint) 1px, transparent 1px);
    background-size: 48px 48px;
    opacity: 0.15;
    pointer-events: none;
  }

  .eyebrow {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 4px;
    color: var(--text-dim);
    margin-bottom: 6px;
  }
  h1 {
    font-weight: 700;
    font-size: 40px;
    letter-spacing: 14px;
    margin: 0 0 4px 8px;
    color: var(--amber);
    text-shadow: 0 0 24px rgba(255,176,32,0.45);
  }
  .sub {
    font-family: 'IBM Plex Mono', monospace;
    color: var(--text-dim);
    font-size: 12px;
    margin-bottom: 48px;
    letter-spacing: 1px;
  }

  /* Reactor / botón de escucha */
  .reactor {
    width: 168px;
    height: 168px;
    position: relative;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .ring {
    position: absolute;
    border-radius: 50%;
    border: 1px solid var(--amber-dim);
  }
  .ring.r1 { inset: 0; }
  .ring.r2 { inset: 18px; border-style: dashed; opacity: 0.6; }
  .ring.r3 { inset: 36px; border: 2px solid var(--amber-dim); }
  .core {
    position: relative;
    width: 84px;
    height: 84px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,176,32,0.18), transparent 70%);
    border: 2px solid var(--amber-dim);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: box-shadow 0.3s, border-color 0.3s;
  }
  .core svg { width: 30px; height: 30px; fill: var(--amber); }

  .reactor.listening .ring.r1 { animation: spin 6s linear infinite; }
  .reactor.listening .ring.r3 { animation: spin 4s linear infinite reverse; }
  .reactor.listening .core {
    border-color: var(--amber);
    box-shadow: 0 0 36px rgba(255,176,32,0.7);
    animation: throb 1s ease-in-out infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes throb {
    0%, 100% { box-shadow: 0 0 20px rgba(255,176,32,0.5); }
    50% { box-shadow: 0 0 44px rgba(255,176,32,0.9); }
  }

  #status {
    margin-top: 22px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    letter-spacing: 1px;
    color: var(--text-dim);
    min-height: 18px;
  }

  .panel {
    margin-top: 30px;
    width: 100%;
    max-width: 520px;
    background: var(--panel);
    border-left: 2px solid var(--amber);
    border-radius: 2px;
    padding: 18px 22px;
    min-height: 56px;
    font-size: 16px;
    line-height: 1.55;
  }
  .panel .you {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 1px;
    color: var(--text-dim);
    text-transform: uppercase;
    margin-bottom: 8px;
  }
  .panel .mit { color: var(--text); }
  .panel .mit-label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--amber);
    letter-spacing: 1px;
    margin-bottom: 4px;
  }
</style>
</head>
<body>

  <div class="eyebrow">PROTOCOLO JARVIS · SESIÓN ACTIVA</div>
  <h1>MIT</h1>
  <div class="sub">TOCA EL NÚCLEO PARA HABLAR</div>

  <div class="reactor" id="orb">
    <div class="ring r1"></div>
    <div class="ring r2"></div>
    <div class="ring r3"></div>
    <div class="core">
      <svg viewBox="0 0 24 24"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"/></svg>
    </div>
  </div>

  <div id="status">en espera</div>

  <div class="panel" id="panel">
    <div class="mit-label">MIT</div>
    <div class="mit">Sistemas listos, señor. Toque el núcleo cuando quiera hablar.</div>
  </div>

  <script>
    // Configuración fija (no editable desde la interfaz)
    const WORKER_URL = 'https://mi-asistente.deivid7575.workers.dev';
    const USER_ID = '1536500922740375673';
    const CHANNEL_ID = '1536519525489573928';

    const orb = document.getElementById('orb');
    const statusEl = document.getElementById('status');
    const panel = document.getElementById('panel');

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition;
    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.lang = 'es-ES';
      recognition.interimResults = false;
      recognition.maxAlternatives = 1;
    }

    function speak(text) {
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = 'es-ES';
      speechSynthesis.speak(utter);
    }

    function renderPanel(you, mit) {
      panel.innerHTML = `
        ${you ? `<div class="you">Tú</div><div class="mit" style="margin-bottom:14px;">${you}</div>` : ''}
        <div class="mit-label">MIT</div>
        <div class="mit">${mit}</div>
      `;
    }

    async function sendToMit(promptText) {
      renderPanel(promptText, 'Procesando...');
      statusEl.textContent = 'procesando';

      try {
        const res = await fetch(WORKER_URL + '/api/voice', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ userId: USER_ID, channelId: CHANNEL_ID, promptText })
        });
        const data = await res.json();
        const respuesta = data.responseText || 'No he podido procesar eso.';
        renderPanel(promptText, respuesta);
        statusEl.textContent = 'en espera';
        speak(respuesta);
      } catch (err) {
        renderPanel(promptText, `Error de conexión: ${err.message}`);
        statusEl.textContent = 'error';
      }
    }

    orb.addEventListener('click', () => {
      if (!recognition) {
        statusEl.textContent = 'voz no soportada — usa Chrome';
        return;
      }
      orb.classList.add('listening');
      statusEl.textContent = 'escuchando...';
      recognition.start();
    });

    if (recognition) {
      recognition.onresult = (event) => sendToMit(event.results[0][0].transcript);
      recognition.onerror = () => { statusEl.textContent = 'no te he oído bien'; };
      recognition.onend = () => orb.classList.remove('listening');
    }
  </script>
</body>
</html>
